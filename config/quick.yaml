# Fast real-SBERT trial (small model, tiny grid, few epochs) to validate your setup before the full run.
seed: 42
output_dir: results_quick
data: {csv_path: data/tawos_issues.csv, projects_file: config/guideline_projects.txt, aliases_file: config/project_aliases.csv, min_issues: 100, max_story_point: 100}
embedding: {model_name: sentence-transformers/all-MiniLM-L6-v2, max_seq_length: 256, cache_dir: cache/embeddings_quick}
cnn:
  max_epochs: 40
  grid: {lr: [0.001], dropout: [0.2], weight_decay: [0.0001]}
  final_seeds: [42]
evaluation: {bootstrap_samples: 300}
